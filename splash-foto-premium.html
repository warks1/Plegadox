<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04111e"><title>PlegadoX · Splash premium original</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04101f;color:#edfcff;font-family:Inter,system-ui,sans-serif}
#screen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#184666,#071a2d 56%,#030914 95%)}
#screen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;background:repeating-linear-gradient(90deg,transparent 0 31px,#7acafe14 32px 33px),repeating-linear-gradient(0deg,transparent 0 31px,#7acafe12 32px 33px)}
#artZone{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(5px,2vmin,20px)}
/* Show the selected original art INTACT across its visible upper 76%.
   The painted-in 78% progress bar at the original image bottom is
   removed by cropping only the last 24% of the image, not by zooming. */
#artFrame{position:relative;width:min(96vw,calc(74dvh * 1672 / 715));max-height:100%;aspect-ratio:1672/715;overflow:hidden;box-shadow:0 20px 38px #0007}
#photo{position:absolute;left:0;top:0;display:block;width:100%;height:auto;max-width:none;-webkit-user-drag:none;user-select:none}
#artFrame::after{content:"";position:absolute;inset:0;border:1px solid #3e94c052;pointer-events:none}
#fallback{display:none;place-items:center;position:absolute;inset:0;font-weight:900;font-size:clamp(35px,7vw,94px);color:#d5efff}
.px-photo-missing #photo{display:none}
.px-photo-missing #artFrame{background:#081a30}
.px-photo-missing #fallback{display:grid}
#dock{position:relative;z-index:2;flex:0 0 auto;width:min(920px,calc(100% - 30px));margin:auto auto 0;padding:10px 0 max(18px,env(safe-area-inset-bottom,0px));display:grid;gap:9px}
#message{text-align:center;color:#e4f7ff;font-size:clamp(13px,2.1vw,20px);font-style:italic;font-weight:800;line-height:1.45;overflow-wrap:anywhere}
#progress{display:flex;align-items:center;gap:11px;min-height:51px;border:1px solid #358ec2;border-radius:16px;padding:7px 12px;background:#071d32;box-shadow:0 0 20px #008ce85a}
#rail{flex:1;min-width:0;overflow:hidden;height:27px;border:2px solid #4bbbe9;border-radius:50px;background:#04101e}
#fill{height:100%;width:0;border-radius:50px;background:linear-gradient(180deg,#bbfbff,#27dffd 35%,#0579d9);transition:width .16s linear;box-shadow:0 0 12px #22dbff99}
#fill::before{content:"";display:block;height:100%;background:repeating-linear-gradient(120deg,transparent 0 22px,#e4fbff33 23px 26px,transparent 27px 43px)}
#percent{min-width:57px;text-align:right;font-size:clamp(17px,3vmin,25px);font-weight:900;font-variant-numeric:tabular-nums}
#legal{color:#8bb0c9;font-size:clamp(9px,1.3vw,12px);text-align:center;line-height:1.45}
#retry{display:none;position:fixed;bottom:18px;right:18px;background:#075a90;border:1px solid #55ceff;padding:10px;color:white;border-radius:8px;z-index:10}
.is-error #retry{display:block}
@media(orientation:portrait){#artZone{padding:10px}
 #artFrame{width:min(96vw,calc(68dvh * 1672 / 715))}
 #dock{width:calc(100% - 28px);gap:12px;padding-bottom:max(23px,env(safe-area-inset-bottom,0px))}
 #message{font-size:clamp(14px,4vw,20px)}#progress{min-height:59px}}
@media(orientation:landscape) and (max-height:500px){
 #artZone{padding:2px 9px}#artFrame{width:min(76vw,calc(61dvh * 1672 / 715))}
 #dock{gap:4px;padding:3px 0 5px;width:min(88vw,920px)}
 #message{font-size:11px;line-height:1.1}
 #progress{min-height:31px;padding:3px 8px;border-radius:8px}
 #rail{height:14px}#percent{font-size:12px;min-width:38px}
 #legal{font-size:8px;line-height:1.1}}
@media(prefers-reduced-motion:reduce){#fill{transition:none}}
</style></head><body>
<main id="screen" role="status" aria-label="Pantalla de carga PlegadoX premium">
 <div id="artZone"><div id="artFrame">
  <img id="photo" src="./plegadox-premium-selected.png" width="1672" height="941"
    alt="Pantalla original PlegadoX elegida: plegadora industrial cromada">
  <div id="fallback">PLEGADO<span style="color:#14ceff">X</span></div>
 </div></div>
 <section id="dock"><div id="message" aria-live="polite">Iniciando PlegadoX…</div>
  <div id="progress" role="progressbar" aria-label="Carga real de PlegadoX" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="rail"><div id="fill"></div></div><output id="percent">0 %</output></div>
  <div id="legal">© 2026 AMS Tecnologics Services · Todos los derechos reservados.</div>
 </section>
 <button id="retry" type="button" onclick="window.parent.location.reload()">Reintentar</button>
</main>
<script>
(()=>{
 const photo=document.getElementById('photo');
 photo.onerror=()=>document.documentElement.classList.add('px-photo-missing');
 const progress=document.getElementById('progress'),fill=document.getElementById('fill'),
  percent=document.getElementById('percent'),message=document.getElementById('message');
 window.PlegadoXLoading={
  setProgress(v){const n=Math.max(0,Math.min(100,Number(v)||0));
   progress.setAttribute('aria-valuenow',String(Math.round(n)));fill.style.width=n+'%';percent.textContent=Math.round(n)+' %';},
  setStatus(v){message.textContent=String(v??'Iniciando PlegadoX…');},
  finish(){this.setProgress(100);this.setStatus('PlegadoX listo');},
  error(v){document.body.classList.add('is-error');this.setStatus(v||'Error al iniciar');}
 };
})();
</script></body></html>
