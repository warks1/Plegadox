<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08121d"><title>PlegadoX · Boceto 1 premium seleccionado</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060c16;color:#fff;font-family:Inter,system-ui,sans-serif}
#screen{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#060c16}
#screen::before{content:"";position:absolute;inset:-32px;z-index:-1;background:url("./plegadox-premium-selected.png") center/cover no-repeat;filter:blur(22px) brightness(.27) saturate(1.2);transform:scale(1.05)}
/* La fotografía aprobada se conserva íntegra: no estirar ni recortar sus píxeles.
   Las franjas de otras relaciones de aspecto se llenan con el fondo derivado de la misma foto. */
#frame{position:relative;width:min(100vw,177.6833vh);width:min(100vw,177.6833dvh);aspect-ratio:1672/941;max-height:100dvh;box-shadow:0 0 38px #0009;min-width:0;flex:none}
#photo{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
#progress{position:absolute;left:10.76%;top:81.4%;width:78.12%;height:7.2%;display:flex;gap:2%;align-items:center;padding:0 .3%;border-radius:80px;background:linear-gradient(180deg,#07111b 0%,#050d17 12%,#0b1928 52%,#050b14 94%);box-shadow:0 0 3px #060d16}
#rail{position:relative;flex:1;height:67%;border:2px solid #9eb9c6;border-radius:80px;background:linear-gradient(180deg,#2c455a,#041224 42%,#0b2739 85%,#425566);box-shadow:inset 0 1px 4px #9ac9e355;overflow:hidden}
#fill{height:100%;width:0;transition:width .23s ease-out;border-radius:80px;background:linear-gradient(180deg,#8af8ff,#04e2fc 30%,#0099ef 72%,#0950b7);box-shadow:0 0 13px #06b7fc}
#fill::before{content:"";display:block;height:100%;background:repeating-linear-gradient(120deg,transparent 0 22px,#e2faff33 23px 25px,transparent 27px 44px)}
#percent{min-width:7.5%;font-weight:900;font-size:clamp(10px,2.2vw,34px);font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 3px 5px #000}
#message{position:absolute;left:11.3%;top:77.75%;font-weight:750;font-style:italic;font-size:clamp(11px,2.12vw,34px);letter-spacing:.02em;text-shadow:0 2px 7px #000e;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#retry{display:none;position:fixed;top:auto;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));padding:10px 16px;background:#092e4f;color:#fff;border:1px solid #63c4ff;border-radius:7px;cursor:pointer;z-index:10}
.is-error #retry{display:block}
@media(max-width:560px){#rail{border-width:1px}#message{font-size:clamp(9px,2.1vw,12px)}#percent{font-size:clamp(10px,2.2vw,15px)}}
@media(orientation:portrait) and (max-aspect-ratio:4/5){
 #frame{width:100vw;max-width:100vw;box-shadow:none;margin-top:-14vh}
 #progress{position:fixed;left:max(5vw,env(safe-area-inset-left));right:max(5vw,env(safe-area-inset-right));top:auto;bottom:calc(20px + env(safe-area-inset-bottom));width:auto;height:54px;padding:0 12px;gap:10px;border:1px solid #367fa7;box-shadow:0 0 28px #04bffe2b}
 #message{position:fixed;left:6vw;right:6vw;max-width:none;top:auto;bottom:calc(83px + env(safe-area-inset-bottom));text-align:center;font-size:clamp(14px,4vw,21px)}
 #percent{font-size:clamp(14px,4vw,19px);min-width:50px}
 #rail{height:25px}
 #retry{bottom:calc(144px + env(safe-area-inset-bottom))}
}
@media(orientation:landscape) and (max-height:460px){
 #message{font-size:clamp(9px,2.5vh,17px)}
 #percent{font-size:clamp(10px,3vh,18px)}
}
@media(prefers-reduced-motion:reduce){#fill{transition:none}}
/* La fotografía elegida permanece SIN alteraciones; en vertical se
   incorpora un visor miniatura ORIGINAL animado de una chapa en V. */
#foldLive{display:none;position:fixed;left:50%;bottom:calc(155px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(83vw,400px);height:clamp(85px,17vh,165px);border:1px solid #6dbce344;border-radius:14px;background:linear-gradient(170deg,#0a1c30ed,#06101df2);box-shadow:0 0 35px #2aa4ff1c;overflow:hidden;z-index:2;pointer-events:none}
#foldLive svg{display:block;width:100%;height:100%}
#foldCaption{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#a8dff2;font-weight:800;font-size:clamp(8px,2vw,11px);letter-spacing:.15em}
#animatedSheet{stroke:#a9e8ff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 0 5px #34cfff)}
#animatedPunch{fill:url(#titaniumPunch);stroke:#e7f9ff;stroke-width:1.5}
@media(orientation:portrait) and (max-aspect-ratio:4/5){
 /* La fotografía elegida YA lleva una barra dibujada. La anterior CSS
    movía la barra REAL al pie y dejaba visible el porcentaje fijo: dos
    barras contradictorias en el iPhone. La barra funcional debe TAPAR
    la ilustrada, dentro de la foto y en la MISMA posición. */
 #foldLive{display:block}
 #frame{margin-top:0!important;transform:translateY(-18vh)}
 #progress{position:absolute;left:10.76%;right:auto;top:81.4%;bottom:auto;
  width:78.12%;height:7.2%;padding:0 .3%;gap:2%;border:0;
  box-shadow:0 0 4px #050c16;background:linear-gradient(180deg,#07111b,#050d17 12%,#0b1928 52%,#050b14)}
 #rail{height:67%;border-width:1px}
 #percent{min-width:7.5%;font-size:clamp(9px,2.5vw,14px)}
 #message{position:absolute;left:11.3%;right:auto;top:77.75%;bottom:auto;
  max-width:75%;text-align:left;font-size:clamp(8px,2.5vw,13px);
  text-shadow:0 0 5px #000;overflow:hidden;white-space:nowrap}
 #screen::before{filter:blur(14px) brightness(.48) saturate(1.15)}
}
@media(orientation:portrait) and (max-height:620px){
 #foldLive{height:80px;bottom:calc(130px + env(safe-area-inset-bottom))}
 #frame{transform:translateY(-14vh)}
}
@media(prefers-reduced-motion:reduce){#foldLive animate,#foldLive animateTransform{display:none}}
</style>
</head><body>
<main id="screen" role="status" aria-label="PlegadoX Premium, pantalla original elegida">
<div id="frame">
<img id="photo" src="./plegadox-premium-selected.png" width="1672" height="941"
 alt="Boceto 1 PlegadoX: prensa plegadora cromada plegando chapa azul plata" draggable="false">
<div id="message" aria-live="polite">Cargando...</div>
<div id="progress" role="progressbar" aria-label="Carga real de PlegadoX" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="rail"><div id="fill"></div></div><output id="percent">0%</output></div>
</div>
<div id="foldLive" aria-hidden="true">
<svg viewBox="0 0 600 210" preserveAspectRatio="xMidYMid meet">
<defs><linearGradient id="titaniumPunch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39566b"/><stop offset=".5" stop-color="#effbff"/><stop offset="1" stop-color="#1d445b"/></linearGradient></defs>
<path d="M145 195 L225 195 L255 140 L300 184 L345 140 L375 195 L455 195" fill="none" stroke="#6d9dba" stroke-width="17" stroke-linejoin="round" opacity=".86"/>
<g><path id="animatedPunch" d="M257 15 L343 15 L320 90 L300 120 L280 90 Z"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 43;0 43;0 0;0 0" keyTimes="0;.34;.6;.8;1" dur="3.6s" repeatCount="indefinite" calcMode="linear"/></g>
<path id="animatedSheet" d="M108 125 L300 125 L492 125">
<animate attributeName="d" values="M108 125 L300 125 L492 125;M108 91 L300 164 L492 91;M108 91 L300 164 L492 91;M108 125 L300 125 L492 125;M108 125 L300 125 L492 125" keyTimes="0;.34;.6;.8;1" dur="3.6s" repeatCount="indefinite"/>
</path>
<circle cx="300" cy="125" r="2" fill="#fff" opacity=".65"/>
</svg><span id="foldCaption">PLEGADOX · CINEMÁTICA DE PLEGADO</span></div>
<button id="retry" type="button" onclick="window.parent.location.reload()">Reintentar inicio</button>
</main>
<script>
(()=>{
'use strict';
const photo=document.getElementById('photo');
photo.onerror=()=>{location.replace('./titanium-loading-original.html');};
const progress=document.getElementById('progress');
const fill=document.getElementById('fill'),percent=document.getElementById('percent'),message=document.getElementById('message');
window.PlegadoXLoading={
 setProgress(value){const v=Number(value);if(!Number.isFinite(v))return;
 const n=Math.max(0,Math.min(100,v));progress.setAttribute('aria-valuenow',String(Math.round(n)));
 fill.style.width=n+'%';percent.textContent=Math.round(n)+'%';},
 setStatus(value){message.textContent=String(value??'Cargando...');},
 finish(){this.setProgress(100);this.setStatus('PlegadoX listo');},
 error(msg){document.body.classList.add('is-error');this.setStatus(msg||'Error de arranque');}
};
})();
</script>
</body></html>
