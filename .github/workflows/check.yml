name: Verificar Plegadox
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis del motor y la interfaz
        run: |
          node --check engine.js
          node --check app.js
          node --check catalog.js
          node --check cockpit.js
          node --check boceto2.js
          node --check machine-visual.js
          node --check tool-profiles.js
          node --check tool-dxf.js
          node --check tool-import-ui.js
          node --check technical-section.js
          node --check tool-collision.js
          node --check machine-config.js
          node --check machine-editor.js
          node --check bend-contact.js
          node --check responsive.js
          node --check studio.js
          node --check render-enhancements.js
          node --check validation.js
          node --check viewer-profile.js
          node --check sheet-solid.js
          node --check dxf-export.js
          node --check flat-layout.js
          node --check sheet-interference.js
          node --check sequence-advisor.js
          node --check canvas-path.js
          node --check pwa.js
          node --check sw.js
          node --check backgauge-placement.js
          node --check collision-playback-guard.js
          node --check gauge-side-review.js
          node --check gauge-interference.js
          node --check incident-navigation.js
      - name: Pruebas de dirección, secuencia y desarrollo
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar pantallas, selección y simulación
        run: |
          node tests/browser-smoke.mjs
          node tests/responsive-smoke.mjs
          node tests/studio-smoke.mjs
          node tests/touch-order-smoke.mjs
          node tests/video-regression-smoke.mjs
          node tests/technical-section-smoke.mjs
          node tests/catalog-contact-smoke.mjs
          node tests/machine-editor-smoke.mjs
          node tests/legacy-canvas-smoke.mjs
          node tests/backgauge-smoke.mjs
          node tests/gauge-side-smoke.mjs
          node tests/punch-stop-visibility-smoke.mjs
          node tests/stop-support-contact-smoke.mjs
          node tests/support-orientation-smoke.mjs
          node tests/gauge-interference-smoke.mjs
          node tests/punch-guard-smoke.mjs
          node tests/reposition-continuity-smoke.mjs
          node tests/controls-regression-smoke.mjs
          node tests/pwa-offline-smoke.mjs
          node tests/tool-dxf-browser-smoke.mjs
      - name: Guardar capturas de escritorio y móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plegadox-capturas
          path: test-results/
          if-no-files-found: ignore
