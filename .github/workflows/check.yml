name: Verificar Plegadox
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar iconos PWA para validar las pruebas
        run: python3 tools/generate-pwa-icons.py
      - name: Comprobar sintaxis de todos los módulos y pruebas
        run: |
          set -eu
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
          python3 -m py_compile tools/generate-pwa-icons.py
      - name: Pruebas de dirección, secuencia y desarrollo
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar iconos PWA para navegador
        run: python3 tools/generate-pwa-icons.py
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar pantallas, selección y simulación
        run: |
          node tests/browser-smoke.mjs
          node tests/responsive-smoke.mjs
          node tests/studio-smoke.mjs
          node tests/touch-order-smoke.mjs
          node tests/video-regression-smoke.mjs
          node tests/gooseneck-browser-smoke.mjs
          node tests/tool-height-browser-smoke.mjs
          node tests/technical-section-smoke.mjs
          node tests/tooling-advisor-smoke.mjs
          node tests/touch-programmer-browser-smoke.mjs
          node tests/mouse-programmer-browser-smoke.mjs
          node tests/playback-controls-r26-smoke.mjs
          node tests/workshop-backup-browser-smoke.mjs
          node tests/project-library-browser-smoke.mjs
          node tests/workshop-calibration-browser-smoke.mjs
          node tests/gauge-framing-smoke.mjs
          node tests/catalog-contact-smoke.mjs
          node tests/machine-editor-smoke.mjs
          node tests/legacy-canvas-smoke.mjs
          node tests/backgauge-smoke.mjs
          node tests/gauge-side-smoke.mjs
          node tests/punch-stop-visibility-smoke.mjs
          node tests/stop-support-contact-smoke.mjs
          node tests/support-orientation-smoke.mjs
          node tests/gauge-interference-smoke.mjs
          node tests/gauge-sequence-review-browser-smoke.mjs
          node tests/front-gauge-contact-smoke.mjs
          node tests/gauge-stop-overlap-smoke.mjs
          node tests/pwa-version-recovery-smoke.mjs
          node tests/punch-guard-smoke.mjs
          node tests/reposition-continuity-smoke.mjs
          node tests/play-header-reorientation-smoke.mjs
          node tests/controls-regression-smoke.mjs
          node tests/pwa-offline-smoke.mjs
          node tests/tool-dxf-browser-smoke.mjs
          node tests/punch-orientation-r27-smoke.mjs
      - name: Guardar capturas de escritorio y móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plegadox-capturas
          path: test-results/
          if-no-files-found: ignore
