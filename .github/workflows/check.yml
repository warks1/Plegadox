name: Verificar Plegadox
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: plegadox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar iconos PWA para validar las pruebas
        run: python3 tools/generate-pwa-icons.py
      - name: Comprobar sintaxis de todos los módulos y pruebas
        run: |
          set -eu
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
          python3 -m py_compile tools/generate-pwa-icons.py
      - name: Pruebas de dirección, secuencia y desarrollo
        run: npm test

  browser:
    runs-on: ubuntu-latest
    # Los 42 tests visuales se reparten en cuatro máquinas en paralelo;
    # un fallo de topes no impide guardar capturas de móvil ni de CAD.
    strategy:
      fail-fast: false
      matrix:
        group: [inicio, simulacion, topes, datos]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar iconos premium PWA para navegador
        run: python3 tools/generate-pwa-icons.py
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar grupo de pantallas y simulación
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.group }}" in
            inicio) scripts="
              tests/titanium-cybelec-browser-smoke.mjs
              tests/titanium-selected-splash-r32-smoke.mjs
              tests/splash-viewport-r35-smoke.mjs
              tests/browser-smoke.mjs
              tests/responsive-smoke.mjs
              tests/studio-smoke.mjs
              tests/controls-regression-smoke.mjs
              tests/pwa-version-recovery-smoke.mjs
              tests/pwa-offline-smoke.mjs
            " ;;
            simulacion) scripts="
              tests/touch-order-smoke.mjs
              tests/video-regression-smoke.mjs
              tests/gooseneck-browser-smoke.mjs
              tests/tool-height-browser-smoke.mjs
              tests/technical-section-smoke.mjs
              tests/tooling-advisor-smoke.mjs
              tests/integrated-bend-planner-smoke.mjs
              tests/volume-r31-browser-smoke.mjs
              tests/touch-programmer-browser-smoke.mjs
              tests/mouse-programmer-browser-smoke.mjs
              tests/playback-controls-r26-smoke.mjs
              tests/punch-orientation-r27-smoke.mjs
            " ;;
            topes) scripts="
              tests/gauge-framing-smoke.mjs
              tests/catalog-contact-smoke.mjs
              tests/machine-editor-smoke.mjs
              tests/legacy-canvas-smoke.mjs
              tests/backgauge-smoke.mjs
              tests/gauge-both-r93-browser-smoke.mjs
              tests/gauge-perspective-r95-browser-smoke.mjs
              tests/gauge-side-smoke.mjs
              tests/punch-stop-visibility-smoke.mjs
              tests/stop-support-contact-smoke.mjs
              tests/support-orientation-smoke.mjs
              tests/gauge-interference-smoke.mjs
              tests/gauge-sequence-review-browser-smoke.mjs
              tests/front-gauge-contact-smoke.mjs
              tests/gauge-stop-overlap-smoke.mjs
              tests/punch-guard-smoke.mjs
              tests/reposition-continuity-smoke.mjs
              tests/play-header-reorientation-smoke.mjs
            " ;;
            datos) scripts="
              tests/workshop-backup-browser-smoke.mjs
              tests/usb-direct-backup-browser-smoke.mjs
              tests/project-library-browser-smoke.mjs
              tests/workshop-calibration-browser-smoke.mjs
              tests/tool-dxf-browser-smoke.mjs
              tests/custom-tool-export-browser-smoke.mjs
              tests/r36-cad-ui-browser-smoke.mjs
            " ;;
            *) echo "Grupo de pruebas desconocido"; exit 2 ;;
          esac
          for script in $scripts; do
            echo "::group::$script"
            # Cada prueba tiene su límite y comunica el archivo que falla.
            timeout --signal=TERM --kill-after=10s 180s node "$script"
            echo "::endgroup::"
          done
      - name: Guardar capturas de escritorio y móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plegadox-capturas-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore
