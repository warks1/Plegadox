name: Compilar PlegadoX portátil USB para Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-portable-usb:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas para compilar EXE sin dependencias externas
        run: python -m pip install "pyinstaller>=6.16,<7" pillow
      - name: Probar servidor localhost y carga de recursos
        run: python -m unittest discover -s portable -p "test_*.py" -v
      - name: Generar icono premium de Windows
        run: python portable/make_icon.py
      - name: Compilar ejecutable con Python incluido
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PlegadoX --icon portable/plegadox.ico portable/launcher.py
      - name: Preparar pendrive completo con aplicación, EXE y guía
        run: python portable/make_bundle.py
      - name: Auditoría completa del contenido web del pendrive
        run: python portable/verify_bundle.py dist/PlegadoX-USB-Windows/app
      - name: Probar el EXE compilado dentro del paquete USB real
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/PlegadoX-USB-Windows/PlegadoX.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El ejecutable portátil falla al servir su HTML y build-info.json: código $($process.ExitCode)"
          }
          Write-Host "PLEGADOX_EXE_WINDOWS_OK"
      - name: Instalar Inno Setup para compilar instalador Windows
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compilar instalador Windows desde los mismos recursos USB
        shell: pwsh
        run: |
          $version = (Get-Content build-info.json -Raw | ConvertFrom-Json).version
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw "Falta compilador Inno Setup" }
          & $iscc "/DMyAppVersion=$version" "portable/plegadox-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Error de Inno Setup" }
          if (!(Test-Path 'dist/installer/PlegadoX-Instalador-Windows.exe')) {
            throw "Falta instalador"
          }
      - name: Probar instalación real, ejecución y desinstalación en Windows
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist/installer/PlegadoX-Instalador-Windows.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalación falla: $($process.ExitCode)" }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\PlegadoX'
          $exe = Join-Path $folder 'PlegadoX.exe'
          if (!(Test-Path $exe) -or !(Test-Path (Join-Path $folder 'installed-mode.marker'))) {
            throw "Archivos instalados incompletos"
          }
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Programa instalado falla --self-test" }
          $uninstaller = Join-Path $folder 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw "No existe desinstalador" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Desinstalación falla" }
          Write-Host "PLEGADOX_INSTALLER_WINDOWS_OK"
      - name: Calcular hashes SHA256 de los dos archivos de distribución
        shell: pwsh
        run: |
          @('dist/PlegadoX-USB-Windows.zip','dist/installer/PlegadoX-Instalador-Windows.exe') |
            ForEach-Object {
              $h = Get-FileHash -Algorithm SHA256 -Path $_
              "$($h.Hash.ToLower())  $(Split-Path $_ -Leaf)"
            } | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Guardar instalador ejecutable y hashes
        uses: actions/upload-artifact@v4
        with:
          name: PlegadoX-Instalador-Windows
          path: |
            dist/installer/PlegadoX-Instalador-Windows.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Guardar ZIP listo para copiar al USB
        uses: actions/upload-artifact@v4
        with:
          name: PlegadoX-USB-Windows
          path: dist/PlegadoX-USB-Windows.zip
          if-no-files-found: error
          retention-days: 30
