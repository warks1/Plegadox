name: PlegadoX · Galaxy Chrome y sólidos 3D R125
on:
  pull_request:
    paths:
      - 'adaptive-render-budget.js'
      - 'machine-volume-viewer.js'
      - 'machine-solid-frame-cache.js'
      - 'machine-axis-trail-evidence.js'
      - 'machine-gauge-evidence.js'
      - 'machine-gauge-depth.js'
      - 'machine-gauge-fingers.js'
      - 'machine-cad-ui.js'
      - 'machine-axis-geometry.js'
      - 'tests/machine-gauge-fingers-r128-browser-smoke.mjs'
      - 'tests/machine-independent-fingers-r129-browser-smoke.mjs'
      - 'tests/machine-axis-evidence-r130-browser-smoke.mjs'
      - 'machine-canvas-memory-r131.js'
      - 'machine-ram-tilt-evidence-r131.js'
      - 'machine-solid-frame-cache.js'
      - 'adaptive-render-budget.js'
      - 'tests/machine-ram-galaxy-r131-browser-smoke.mjs'
      - 'machine-swept-broadphase-r132.js'
      - 'tests/machine-swept-broadphase-r132-browser-smoke.mjs'
      - 'machine-interference-pairs-r133.js'
      - 'machine-mount-compatibility-r133.js'
      - 'tests/machine-interference-matrix-r133-browser-smoke.mjs'
      - 'machine-first-penetration-r134.js'
      - 'tests/machine-first-penetration-r134-browser-smoke.mjs'
      - 'machine-contact-evolution-r135.js'
      - 'tests/machine-contact-evolution-r135-browser-smoke.mjs'
      - 'machine-cnc-gauge-semaphore-r136.js'
      - 'tests/machine-cnc-gauge-semaphore-r136-browser-smoke.mjs'
      - 'cad-evidence-ui.js'
      - 'cad-evidence-ui.js'
      - 'cad-evidence.js'
      - 'machine-axis-evidence.js'
      - 'machine-axis-motion.js'
      - 'volume-trajectory-review.js'
      - 'machine-cad.js'
      - 'volume-engine.js'
      - 'machine-solid-gauge-style.js'
      - 'machine-volume-layers.js'
      - 'tests/gauge-volume-r127-browser-smoke.mjs'
      - 'studio.js'
      - 'tests/machine-volume-r126-browser-smoke.mjs'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/machine-volume-r125-browser-smoke.mjs'
      - '.github/workflows/galaxy-solids-r125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  galaxy-solids:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium y Playwright
        run: |
          python3 tools/generate-pwa-icons.py
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar malla y respuesta Galaxy/PC
        run: node tests/machine-volume-r125-browser-smoke.mjs
      - name: Comprobar caché orbital y causas del semáforo en Galaxy
        run: node tests/machine-volume-r126-browser-smoke.mjs
      - name: Comprobar Z del tope, capas y captura 3D en Galaxy
        run: node tests/gauge-volume-r127-browser-smoke.mjs
      - name: Comprobar dos dedos físicos Z1/Z2, pose y caché Galaxy
        run: node tests/machine-gauge-fingers-r128-browser-smoke.mjs
      - name: Comprobar dedos CAD diferentes y bloqueo por revisión en Galaxy
        run: node tests/machine-independent-fingers-r129-browser-smoke.mjs
      - name: Comprobar evidencia física por cuerpo y exportación CNC en Galaxy
        run: node tests/machine-axis-evidence-r130-browser-smoke.mjs
      - name: Probar protección de memoria y caché de golpes en Galaxy
        run: node tests/machine-ram-galaxy-r131-browser-smoke.mjs
      - name: Verificar descartes 3D sin falsos negativos y nuevas matrices OEM en Galaxy
        run: node tests/machine-swept-broadphase-r132-browser-smoke.mjs
      - name: Auditar montajes OEM y parejas de interferencia sin CAD en Galaxy
        run: node tests/machine-interference-matrix-r133-browser-smoke.mjs
      - name: Comprobar primera ventana temporal de penetración modelada y JSON CNC en Galaxy
        run: node tests/machine-first-penetration-r134-browser-smoke.mjs
      - name: Distinguir solapes de montaje previos y penetraciones nuevas en Chrome Galaxy
        run: node tests/machine-contact-evolution-r135-browser-smoke.mjs
      - name: Probar semáforo separado del tope 2D y del CNC en Chrome Galaxy
        run: node tests/machine-cnc-gauge-semaphore-r136-browser-smoke.mjs
      - name: Adjuntar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plegadox-r125-galaxy-3d
          path: |
            test-results/r125-solids-*.png
            test-results/r126-galaxy-*.png
            test-results/r127-*.png
            test-results/r128-*.png
            test-results/r129-*.png
            test-results/r130-*.png
            test-results/r131-*.png
            test-results/r132-*.png
            test-results/r133-*.png
            test-results/r134-*.png
            test-results/r135-*.png
            test-results/r136-*.png
          if-no-files-found: warn
          retention-days: 20
