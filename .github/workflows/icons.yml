name: Verificar iconos industriales PlegadoX
on:
  push:
    branches: [main, fix/r28-pwa-save-errors]
    paths:
      - 'tools/generate-pwa-icons.py'
      - 'favicon.svg'
      - 'icon-premium-180.png'
      - 'icon-premium-192.png'
      - 'icon-premium-512.png'
      - '.github/workflows/icons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar PNG premium de 180, 192 y 512 píxeles
        run: |
          python3 tools/generate-pwa-icons.py
          python3 -m py_compile tools/generate-pwa-icons.py
      - name: Verificar que el manifest y iOS usan los iconos premium
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          html=Path('index.html').read_text()
          icons={item['src'] for item in manifest['icons']}
          assert './icon-premium-192.png' in icons
          assert './icon-premium-512.png' in icons
          assert 'href="./icon-premium-180.png"' in html
          print('Iconos PWA/iOS premium verificables: OK')
          PY
