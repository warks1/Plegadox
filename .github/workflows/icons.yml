name: Generar iconos PWA PlegadoX
on:
  push:
    branches: [main, fix/r28-pwa-save-errors]
    paths:
      - 'tools/generate-pwa-icons.py'
      - 'favicon.svg'
      - '.github/workflows/icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generar PNG 180, 192 y 512 px
        run: python3 tools/generate-pwa-icons.py
      - name: Incorporar iconos a Git para GitHub Pages
        run: |
          git add icon-180.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(pwa): publicar iconos PNG PlegadoX"
            git push
          fi
