name: Publicar instalador Windows en Releases
on:
  workflow_run:
    workflows: ["Compilar PlegadoX portátil USB para Windows"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos Windows de la compilación aprobada
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dist/installer dist/usb
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name PlegadoX-Instalador-Windows --dir dist/installer
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name PlegadoX-USB-Windows --dir dist/usb
          installer_file="$(find dist/installer -type f -name 'PlegadoX-Instalador-Windows.exe' -print -quit)"
          checksum_file="$(find dist/installer -type f -name 'SHA256SUMS.txt' -print -quit)"
          usb_file="$(find dist/usb -type f -name 'PlegadoX-USB-Windows.zip' -print -quit)"
          test -n "$installer_file" && test -s "$installer_file"
          test -n "$checksum_file" && test -s "$checksum_file"
          test -n "$usb_file" && test -s "$usb_file"
          cp "$installer_file" dist/installer/PlegadoX-Instalador-Windows.exe
          cp "$usb_file" dist/usb/PlegadoX-USB-Windows.zip
          cp "$checksum_file" dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Publicar instalador y paquete USB en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.9.118
          TAG: v0.9.118
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/installer/PlegadoX-Instalador-Windows.exe dist/usb/PlegadoX-USB-Windows.zip dist/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              dist/installer/PlegadoX-Instalador-Windows.exe \
              dist/usb/PlegadoX-USB-Windows.zip \
              dist/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "PlegadoX 0.9.118 · R144 · Windows" \
              --notes "Versión R144 (0.9.118). Instalador Windows x64 (.exe), paquete portátil para USB (.zip) y hashes SHA-256. El instalador ha superado la prueba automatizada de instalación, arranque y desinstalación en Windows. Comprueba los requisitos del sistema y conserva una copia de seguridad de tus proyectos antes de actualizar."
          fi
