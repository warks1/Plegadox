<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 704" role="img" aria-labelledby="title desc">
<title id="title">PlegadoX: plegadora con WILA y matriz Promecam montados y alineados</title>
<desc id="desc">Punzón montado en el cabezal superior WILA, V16 sobre adaptador Promecam y mesa inferior; ambos centrados sobre el mismo eje de plegado. La chapa se pliega entre ambos.</desc>
<defs>
 <linearGradient id="bg" x1=".1" y1=".2" x2=".8" y2="1"><stop stop-color="#0a1f32"/><stop offset=".47" stop-color="#081827"/><stop offset="1" stop-color="#030b17"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset=".15" stop-color="#819bb0"/><stop offset=".29" stop-color="#203b56"/><stop offset=".49" stop-color="#a4bacc"/><stop offset=".65" stop-color="#edf7ff"/><stop offset=".86" stop-color="#456179"/><stop offset="1" stop-color="#061d31"/></linearGradient>
 <linearGradient id="darkmetal" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#44586b"/><stop offset=".12" stop-color="#162a3f"/><stop offset=".4" stop-color="#304b63"/><stop offset=".65" stop-color="#0c2235"/><stop offset="1" stop-color="#0a1a2b"/></linearGradient>
 <linearGradient id="blade" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#24384f"/><stop offset=".13" stop-color="#b0c8d7"/><stop offset=".3" stop-color="#f5fcff"/><stop offset=".49" stop-color="#567f99"/><stop offset=".66" stop-color="#cfe2ee"/><stop offset="1" stop-color="#33526b"/></linearGradient>
 <linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f6ff"/><stop offset=".16" stop-color="#66849a"/><stop offset=".45" stop-color="#182f46"/><stop offset=".72" stop-color="#b3c6d5"/><stop offset="1" stop-color="#304e65"/></linearGradient>
 <linearGradient id="blue" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#cbfbff"/><stop offset=".23" stop-color="#4de6ff"/><stop offset=".54" stop-color="#178bec"/><stop offset="1" stop-color="#064eaa"/></linearGradient>
 <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#648da7"/><stop offset=".23" stop-color="#163b56"/><stop offset=".52" stop-color="#0b2036"/><stop offset="1" stop-color="#021020"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#087fc1" stop-opacity=".68"/><stop offset=".65" stop-color="#0a3c64" stop-opacity=".13"/><stop offset="1" stop-color="#00162a" stop-opacity="0"/></radialGradient>
 <pattern id="grating" width="21" height="21" patternUnits="userSpaceOnUse"><path d="M0 20L21 0 M-5 5L5 -5" stroke="#8ecaff" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="7" dy="9" stdDeviation="7" flood-color="#000c18" flood-opacity=".8"/></filter>
</defs>
<rect width="920" height="704" fill="url(#bg)"/>
<rect width="920" height="704" fill="url(#grating)" opacity=".35"/>
<ellipse cx="460" cy="428" rx="408" ry="260" fill="url(#halo)"/>
<!-- fixed machine side uprights and guard -->
<g fill="url(#frame)" stroke="#577a96" stroke-width="2">
 <path d="M34 62L102 62L116 594L38 595Z"/>
 <path d="M814 62L879 62L889 596L798 596Z"/>
</g>
<g fill="#081827" stroke="#6f93ac" stroke-width="1.7">
 <path d="M45 91L78 91L83 577L48 577Z"/><path d="M825 91L863 91L867 574L818 574Z"/>
</g>
<!-- fixed lower table/bolster and support, lower punch never moves -->
<g filter="url(#shadow)">
 <path d="M34 579H891V632H34Z" fill="url(#steel)" stroke="#c8e3f5" stroke-width="2.5"/>
 <path d="M34 608H891V649H34Z" fill="url(#darkmetal)" stroke="#456b84" stroke-width="2"/>
 <path d="M40 648H881V682H40Z" fill="#06192b" stroke="#2a5a76" stroke-width="3"/>
 <path d="M38 597H892" stroke="#85e0ff" stroke-opacity=".6" stroke-width="3"/>
</g>
<g fill="#061827" stroke="#698ba5" stroke-width="2">
 <circle cx="87" cy="610" r="9"/><circle cx="147" cy="610" r="9"/><circle cx="221" cy="610" r="9"/><circle cx="301" cy="610" r="9"/>
 <circle cx="619" cy="610" r="9"/><circle cx="695" cy="610" r="9"/><circle cx="772" cy="610" r="9"/><circle cx="844" cy="610" r="9"/>
</g>
<!-- crowned bed and Promecam die adapter on the LOWER MACHINE BED -->
<g filter="url(#shadow)">
 <path d="M265 554H651V579H265Z" fill="url(#darkmetal)" stroke="#91bcd5" stroke-width="3"/>
 <path d="M300 536H614V556H300Z" fill="url(#steel)" stroke="#d2e9f9" stroke-width="2.5"/>
 <path d="M305 536H610" stroke="#79e6ff" stroke-opacity=".55" stroke-width="2"/>
 <g fill="#122638" stroke="#9cb6c9" stroke-width="2"><circle cx="334" cy="547" r="6"/><circle cx="580" cy="547" r="6"/></g>
 <text x="457" y="570" font-size="11" fill="#a2d2ea" font-family="system-ui" text-anchor="middle" letter-spacing="2">ADAPTADOR PROMECAM</text>
 <!-- V16 die clamps physically supported by adapter; V cavity opens upward -->
 <path d="M345 427L407 427L459 507L511 427L574 427L574 537L345 537Z"
  fill="url(#die)" stroke="#c0e4f7" stroke-width="3.2" stroke-linejoin="round"/>
 <path d="M405 427L459 507L513 427" stroke="#071729" stroke-width="17" stroke-linecap="square" stroke-linejoin="round" fill="none"/>
 <path d="M407 427L459 507L511 427" stroke="#a9dfff" stroke-opacity=".7" stroke-width="2.5" fill="none"/>
 <path d="M352 432H389M529 432H567" stroke="#e1f7ff" stroke-width="2.5"/>
 <text x="458" y="527" font-family="system-ui" font-size="19" font-weight="800" text-anchor="middle" fill="#ecf7ff" letter-spacing="3">V16</text>
</g>
<!-- Upper RAM / clamping / mounted punch moves as one complete assembly -->
<g id="upperMachine" filter="url(#shadow)">
 <animateTransform attributeName="transform" type="translate" dur="3.5s" repeatCount="indefinite"
  values="0,-64;0,-64;0,0;0,0;0,-64" keyTimes="0;.23;.54;.70;1" calcMode="spline"
  keySplines=".23 0 .33 1;.23 0 .33 1;.23 0 .33 1;.23 0 .33 1"/>
 <!-- upper ram is a continuous beam, NOT a floating punch -->
 <path d="M80 44H837V172H80Z" fill="url(#darkmetal)" stroke="#7697b1" stroke-width="3"/>
 <path d="M80 44H837V72H80Z" fill="url(#steel)" opacity=".52"/>
 <path d="M90 172H827V191H90Z" fill="url(#steel)" stroke="#b4d4e5" stroke-width="2"/>
 <g fill="#0c253d" stroke="#7da6bf" stroke-width="2">
  <rect x="101" y="159" width="105" height="35" rx="4"/>
  <rect x="214" y="159" width="112" height="35" rx="4"/>
  <rect x="590" y="159" width="114" height="35" rx="4"/>
  <rect x="714" y="159" width="106" height="35" rx="4"/>
 </g>
 <g fill="#c1d9e9" font-size="11" font-family="system-ui" font-weight="750">
  <text x="150" y="180">WILA</text><text x="258" y="180">WILA</text>
  <text x="630" y="180">WILA</text><text x="748" y="180">WILA</text>
 </g>
 <!-- WILA upper clamp: aligns exactly with die center X459 -->
 <path d="M348 181H570V239H348Z" fill="url(#darkmetal)" stroke="#d3e9f9" stroke-width="2.5"/>
 <path d="M363 239H553V259H363Z" fill="url(#steel)" stroke="#bddff0" stroke-width="2.5"/>
 <path d="M376 250H542V269H376Z" fill="#20374f" stroke="#95cbe3" stroke-width="2"/>
 <g fill="#0b2237" stroke="#b4c8d6" stroke-width="2">
  <circle cx="388" cy="220" r="10"/><circle cx="529" cy="220" r="10"/>
  <circle cx="399" cy="259" r="5"/><circle cx="519" cy="259" r="5"/>
 </g>
 <text x="459" y="215" fill="#cde6f7" text-anchor="middle" font-size="15" font-family="system-ui" font-weight="850" letter-spacing="3">WILA</text>
 <!-- Gooseneck-like punch, the tang/upper tool fixed inside WILA clamp -->
 <path d="M404 267H513L507 318L482 359L481 394L459 449L436 394L438 354L410 321Z"
  fill="url(#blade)" stroke="#d6f7ff" stroke-width="3" stroke-linejoin="round"/>
 <path d="M413 277H503L497 315L476 346" stroke="#f1fbff" stroke-opacity=".48" stroke-width="4" fill="none"/>
 <path d="M459 449L440 401" stroke="#6d9eb8" stroke-width="2.3" opacity=".75"/>
 <text x="497" y="365" fill="#d1f4ff" font-family="system-ui" font-size="12" font-weight="750">88°</text>
</g>
<!-- bent sheet: real V groove is BELOW sheet and ram punch tip is on same X -->
<g id="workpiece">
 <path id="sheetGlow" d="M173 423L421 423Q459 423 497 423L745 423" fill="none" stroke="#0daeff"
  stroke-width="23" opacity=".45" filter="url(#glow)">
  <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
   values="M173 423L421 423Q459 423 497 423L745 423;
           M173 423L421 423Q459 423 497 423L745 423;
           M173 337L422 432Q459 478 496 432L745 337;
           M173 337L422 432Q459 478 496 432L745 337;
           M173 423L421 423Q459 423 497 423L745 423"
   keyTimes="0;.23;.54;.70;1"/>
 </path>
 <path id="sheet" d="M173 423L421 423Q459 423 497 423L745 423"
  fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
  <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
   values="M173 423L421 423Q459 423 497 423L745 423;
           M173 423L421 423Q459 423 497 423L745 423;
           M173 337L422 432Q459 478 496 432L745 337;
           M173 337L422 432Q459 478 496 432L745 337;
           M173 423L421 423Q459 423 497 423L745 423"
   keyTimes="0;.23;.54;.70;1"/>
 </path>
 <path d="M173 418L421 418Q459 418 497 418L745 418"
  stroke="#d7fbff" stroke-width="2" fill="none" opacity=".77">
  <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
   values="M173 418L421 418Q459 418 497 418L745 418;
           M173 418L421 418Q459 418 497 418L745 418;
           M173 331L422 426Q459 472 496 426L745 331;
           M173 331L422 426Q459 472 496 426L745 331;
           M173 418L421 418Q459 418 497 418L745 418"
   keyTimes="0;.23;.54;.70;1"/>
 </path>
</g>
<!-- Axis legend, visually verifiable -->
<path d="M459 176V526" stroke="#48ddff" stroke-width="1" stroke-dasharray="7 8" opacity=".28"/>
<text x="580" y="412" fill="#b8e8fa" font-family="system-ui" font-size="12" letter-spacing="1">EJE DEL PUNZÓN = EJE DE LA V</text>
<path d="M565 416H490" stroke="#69e3ff" opacity=".6" stroke-width="2"/>
<rect x="16" y="15" width="888" height="675" rx="14" stroke="#377994" stroke-width="2" fill="none"/>
</svg>